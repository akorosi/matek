  [x-cloak]{display:none!important}
  *{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{-webkit-user-select:none;user-select:none;background:linear-gradient(135deg,#1e3c72,#2a5298)}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:24px;color:#fff;padding:10px;box-shadow:0 10px 25px #0004;transition:transform .08s}
  .tile:active{transform:scale(.97)}
  .tile b{font-size:clamp(17px,2.4vw,24px);text-align:center}
  .tile small{opacity:.9;font-size:clamp(11px,1.5vw,14px);text-align:center}
  .pop{animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  input,textarea{-webkit-user-select:text;user-select:text}
  .tiles{display:grid;gap:16px;min-height:0;flex:1;grid-auto-rows:1fr}
  .shp{display:inline-flex;vertical-align:middle}
  .tcard>*{flex-shrink:0}
  .tbw{overflow-x:auto;padding-bottom:4px}
  .tb{border-collapse:separate;border-spacing:6px;margin:0 auto}
  .tb th{padding:0 4px}
  .tb td{min-width:52px;height:52px;text-align:center;font-size:24px;font-weight:800;border-radius:12px;background:var(--color-base-200)}
  .cell{width:100%;height:52px;border-radius:12px;border:3px dashed var(--color-base-300);background:var(--color-base-100);font-size:24px;font-weight:800;color:var(--color-primary)}
  .cell.sel{border-style:solid;border-color:var(--color-primary)}
  .cell.ok{border-style:solid;border-color:var(--color-success);color:var(--color-success)}
  .cell.bad{border-style:solid;border-color:var(--color-error);color:var(--color-error)}
  .rule{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;border-radius:16px;border:3px solid transparent}
  .rule.ok{border-color:var(--color-success)}
  .rule.bad{border-color:var(--color-error)}
  .slot{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--color-base-200);font-size:28px;font-weight:800}
  .slot.op{background:var(--color-base-300)}
  .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:24rem;margin:0 auto}
  .msg{text-align:center;font-weight:700}
  .cell.sol{border-style:solid;border-color:var(--color-warning);color:var(--color-warning)}
  .solbox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:16px;border:3px solid var(--color-warning)}
  .solr{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:800}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0009;padding:16px}
  .mbox{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:24rem;padding:20px;border-radius:24px;background:var(--color-base-100);box-shadow:0 20px 40px #0006}
  .mdisp{min-width:8rem;min-height:64px;display:flex;align-items:center;justify-content:center;border-radius:16px;border:4px solid var(--color-primary);background:var(--color-base-200);font-size:40px;font-weight:800}
  .mopts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .mopt{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--color-base-200);font-size:40px;font-weight:800}

</head>
<body>
<main x-data="app()" class="mx-auto flex h-dvh max-w-3xl flex-col p-3 text-base-content">

  <!-- MENÜ -->
  <section x-show="view=='menu'" x-cloak class="flex min-h-0 flex-1 flex-col gap-3">
    <h1 class="py-1 text-center text-3xl font-extrabold text-white">Matek Gyakorló</h1>
    <div class="grid min-h-0 flex-1 grid-cols-2 gap-4" style="grid-template-rows:1fr 1fr auto">
      <button class="tile" style="background:linear-gradient(135deg,#ff9966,#ff5e62)" @click="openSub('mul')">
        <i data-lucide="x" class="size-14" stroke-width="3"></i><b>Szorzás</b><small>Szorzótábla és egyéb műveletek</small></button>
      <button class="tile" style="background:linear-gradient(135deg,#a770ef,#cf8bf3)" @click="openSub('div')">
        <i data-lucide="divide" class="size-14" stroke-width="3"></i><b>Osztás</b><small>Osztás és egyéb műveletek</small></button>
      <button class="tile" style="background:linear-gradient(135deg,#36d1dc,#5b86e5)" @click="openSub('basic')">
        <i data-lucide="calculator" class="size-14"></i><b>Alapműveletek</b><small>Összeadás, kivonás, műveletek sorrendje</small></button>
      <button class="tile" style="background:linear-gradient(135deg,#43cea2,#185a9d)" @click="open('table')">
        <i data-lucide="grid-3x3" class="size-14"></i><b>Táblázatos feladatok</b><small>Találd ki a szabályt!</small></button>
      <button class="tile" style="flex-direction:row;grid-column:1/-1;background:linear-gradient(135deg,#606c88,#3f4c6b)" @click="view='settings'">
        <i data-lucide="settings" class="size-8"></i><b>Beállítások</b></button>
    </div>
  </section>

  <!-- ALMENÜ -->
  <section x-show="view=='sub'" x-cloak class="flex min-h-0 flex-1 flex-col gap-3">
    <div class="flex items-center justify-between text-white">
      <button class="btn btn-ghost text-white" @click="view='menu'"><i data-lucide="arrow-left" class="size-5"></i>Vissza</button>
      <h1 class="text-2xl font-extrabold" x-text="{mul:'Szorzás',div:'Osztás',basic:'Alapműveletek'}[grp]"></h1>
      <span class="w-14"></span>
    </div>
    <div class="tiles" x-show="grp=='mul'">
      <button class="tile" style="background:linear-gradient(135deg,#ff9966,#ff5e62)" @click="open('mult')">
        <i data-lucide="x" class="size-14" stroke-width="3"></i><b>Szorzótábla</b><small>Szorzás gyakorlása</small></button>
      <button class="tile" style="background:linear-gradient(135deg,#f7971e,#ffd200)" @click="open('multExtra')">
        <i data-lucide="calculator" class="size-14"></i><b>Szorzás és egyéb műveletek</b><small>Szorzás + összeadás vagy kivonás</small></button>
    </div>
    <div class="tiles" x-show="grp=='div'">
      <button class="tile" style="background:linear-gradient(135deg,#a770ef,#cf8bf3)" @click="open('div')">
        <i data-lucide="divide" class="size-14" stroke-width="3"></i><b>Osztás</b><small>A szorzótábla visszafelé</small></button>
      <button class="tile" style="background:linear-gradient(135deg,#8e2de2,#4a00e0)" @click="open('divExtra')">
        <i data-lucide="diff" class="size-14"></i><b>Osztás és egyéb műveletek</b><small>Osztás + összeadás vagy kivonás</small></button>
    </div>
    <div class="tiles" x-show="grp=='basic'">
      <button class="tile" style="background:linear-gradient(135deg,#36d1dc,#5b86e5)" @click="open('addsub')">
        <i data-lucide="diff" class="size-14"></i><b>Összeadás és kivonás</b><small>Például: 67 + 15 = ?</small></button>
      <button class="tile" style="background:linear-gradient(135deg,#11998e,#38ef7d)" @click="open('order')">
        <i data-lucide="list-ordered" class="size-14"></i><b>Műveletek sorrendje</b><small>Például: 18 + 21 : 3 = ?</small></button>
      <button class="tile" style="background:linear-gradient(135deg,#ee0979,#ff6a00)" @click="open('paren')">
        <i data-lucide="parentheses" class="size-14"></i><b>Zárójeles feladatok</b><small>Például: (12 + 8) : 4 = ?</small></button>
    </div>
  </section>

  <!-- KEZDÉS -->
  <section x-show="view=='intro'" x-cloak class="flex min-h-0 flex-1 flex-col gap-3">
    <div><button class="btn btn-ghost text-white" @click="back()"><i data-lucide="arrow-left" class="size-5"></i>Vissza</button></div>
    <div class="card flex-1 items-center justify-center gap-4 bg-base-100 p-6 text-center shadow-2xl">
      <i data-lucide="circle-play" class="size-24 text-primary"></i>
      <h2 class="text-3xl font-extrabold" x-text="T[mode]?.[0]"></h2>
      <p class="text-base-content/70" x-text="T[mode]?.[1]"></p>
      <p class="font-bold text-primary" x-text="info"></p>
      <button class="btn btn-success btn-xl mt-2 px-16 text-3xl" @click="start()">Kezdés</button>
    </div>
  </section>

  <!-- JÁTÉK -->
  <section x-show="view=='game'" x-cloak class="flex min-h-0 flex-1 flex-col gap-3">
    <div class="flex items-center justify-between text-white">
      <div class="flex gap-2">
        <div class="badge badge-lg border-0 bg-white/15 py-4 text-white">Feladat: <b x-text="times.length"></b></div>
        <div class="badge badge-lg border-0 bg-white/15 py-4 text-white">Átlag: <b x-text="times.length?f(avg):'–'"></b></div>
      </div>
      <button class="btn btn-error" @click="finish()"><i data-lucide="flag" class="size-5"></i>Befejezés</button>
    </div>
    <div class="card relative min-h-0 flex-1 items-center gap-2 overflow-hidden bg-base-100 p-4 shadow-2xl">
      <div class="mt-2 text-center font-extrabold" :style="'font-size:'+psize" x-text="problem+' = ?'"></div>
      <div class="font-semibold text-primary" x-text="f(el)"></div>
      <div class="flex min-w-40 items-center justify-center rounded-2xl border-4 bg-base-200 px-6 font-bold"
           :class="input?'border-primary':'border-base-300'" style="min-height:clamp(46px,7vh,64px);font-size:clamp(28px,4.5vh,44px)" x-text="input"></div>
      <div class="mt-2 grid w-full max-w-sm grid-cols-3 gap-2">
        <template x-for="k in [1,2,3,4,5,6,7,8,9,'⌫',0,'✔']" :key="k">
          <button class="btn text-3xl" style="height:clamp(50px,8vh,78px)"
                  :class="k=='⌫'?'btn-warning':k=='✔'?'btn-primary':'btn-neutral btn-soft'" @click="press(k)" x-text="k"></button>
        </template>
      </div>
      <div x-show="fb" class="pointer-events-none absolute inset-0 z-10 flex items-center justify-center bg-white/85">
        <div x-show="fb=='ok'" class="pop"><i data-lucide="circle-check" class="size-48 text-success" stroke-width="2.5"></i></div>
        <div x-show="fb=='bad'" class="pop"><i data-lucide="circle-x" class="size-48 text-error" stroke-width="2.5"></i></div>
      </div>
    </div>
  </section>

  <!-- TÁBLÁZATOS FELADAT -->
  <section x-show="view=='table'" x-cloak class="flex min-h-0 flex-1 flex-col gap-3">
    <div class="flex items-center justify-between text-white">
      <div class="flex gap-2">
        <div class="badge badge-lg border-0 bg-white/15 py-4 text-white">Kész: <b x-text="times.length"></b></div>
        <div class="badge badge-lg border-0 bg-white/15 py-4 text-white"><b x-text="f(el)"></b></div>
      </div>
      <button class="btn btn-error" @click="finish()"><i data-lucide="flag" class="size-5"></i>Befejezés</button>
    </div>
    <div class="card tcard min-h-0 flex-1 gap-3 overflow-y-auto bg-base-100 p-4 shadow-2xl">
      <p class="text-center text-lg font-bold">Találd ki a hiányzó számokat és a szabályt!</p>
      <div class="tbw"><table class="tb">
        <template x-for="r in [0,1,2]" :key="r">
          <tr>
            <th x-html="shape(r,36)"></th>
            <template x-for="(c,i) in tb.cols" :key="i">
              <td>
                <span x-show="tb.hide[i]!==r" x-text="c[r]"></span>
                <button x-show="tb.hide[i]===r" class="cell" @click="openNum(i)"
                        :class="tb.shown?'sol':tb.cok[i]===true?'ok':tb.cok[i]===false?'bad':''" x-text="tb.val[i]===''?'?':tb.val[i]"></button>
              </td>
            </template>
          </tr>
        </template>
      </table></div>
      <template x-for="(ru,ri) in tb.rules" :key="ri">
        <div class="rule" :class="tb.rok[ri]===true?'ok':tb.rok[ri]===false?'bad':''">
          <template x-for="j in [0,1,2,3,4]" :key="j">
            <button class="slot" :class="j%2?'op':''" @click="openSlot(ri,j)" x-html="ru[j]==null?'?':j%2?ru[j]:shape(ru[j],32)"></button>
          </template>
        </div>
      </template>
      <div x-show="tb.shown" class="solbox">
        <b>A szabály:</b>
        <template x-for="(sr,si) in tb.sol" :key="si">
          <div class="solr"><span x-html="shape(sr[0],30)"></span><span x-text="sr[1]"></span><span x-html="shape(sr[2],30)"></span><span>=</span><span x-html="shape(sr[4],30)"></span></div>
        </template>
      </div>
      <p x-show="tb.msg" class="msg" :class="tb.shown?'text-warning':tb.done?'text-success':'text-error'" x-text="tb.msg"></p>
      <div x-show="!tb.done" class="flex flex-wrap justify-center gap-3">
        <button class="btn btn-success btn-lg text-2xl" style="padding-inline:2rem" @click="check()">Ellenőrzés</button>
        <button class="btn btn-warning btn-lg text-2xl" style="padding-inline:2rem" @click="reveal()">Megoldás</button>
      </div>
      <button x-show="tb.done" class="btn btn-primary btn-lg mx-auto text-2xl" style="padding-inline:2rem" @click="nextTable()">Következő feladat</button>
    </div>
    <!-- Felugró ablak: szám beírása, forma vagy művelet választása -->
    <div x-show="md" x-cloak class="modal" @click.self="md=null">
      <div class="mbox">
        <template x-if="md&&md.k=='num'">
          <div class="flex w-full flex-col items-center gap-3">
            <b class="text-xl">Írd be a számot!</b>
            <div class="mdisp" x-text="md.v===''?'?':md.v"></div>
            <div class="kp">
              <template x-for="k in [1,2,3,4,5,6,7,8,9,'⌫',0,'✔']" :key="k">
                <button class="btn text-3xl" style="height:clamp(48px,8vh,70px)"
                        :class="k=='⌫'?'btn-warning':k=='✔'?'btn-primary':'btn-neutral btn-soft'" @click="mpress(k)" x-text="k"></button>
              </template>
            </div>
          </div>
        </template>
        <template x-if="md&&md.k!='num'">
          <div class="flex w-full flex-col items-center gap-3">
            <b class="text-xl" x-text="md.k=='sh'?'Válassz formát!':'Válassz műveletet!'"></b>
            <div class="mopts">
              <template x-for="o in md.k=='sh'?[0,1,2]:OPS" :key="o">
                <button class="mopt" @click="mpick(o)" x-html="md.k=='sh'?shape(o,48):o"></button>
              </template>
            </div>
          </div>
        </template>
        <button class="btn btn-ghost" @click="md=null">Mégse</button>
      </div>
    </div>
  </section>

  <!-- EREDMÉNY -->
  <section x-show="view=='summary'" x-cloak class="flex min-h-0 flex-1 flex-col gap-3">
    <h1 class="text-2xl font-extrabold text-white">Eredmény</h1>
    <div class="card min-h-0 flex-1 items-center gap-3 overflow-y-auto bg-base-100 p-5 text-center shadow-2xl">
      <i data-lucide="trophy" class="size-16 text-warning"></i>
      <h2 class="text-2xl font-extrabold" x-text="T[mode]?.[0]"></h2>
      <div class="stats stats-vertical bg-base-200 sm:stats-horizontal">
        <div class="stat"><div class="stat-title">Megoldott</div><div class="stat-value" x-text="times.length"></div></div>
        <div class="stat"><div class="stat-title">Átlag</div><div class="stat-value" x-text="times.length?f(avg):'–'"></div></div>
        <div class="stat"><div class="stat-title">Legjobb</div><div class="stat-value" x-text="times.length?f(best):'–'"></div></div>
        <div class="stat"><div class="stat-title">Leglassabb</div><div class="stat-value" x-text="times.length?f(worst):'–'"></div></div>
      </div>
      <div class="relative h-56 w-full shrink-0" x-show="times.length"><canvas x-ref="cv"></canvas></div>
      <button class="btn btn-primary btn-lg mt-2" @click="view='menu'">Vissza a főmenübe</button>
    </div>
  </section>

  <!-- BEÁLLÍTÁSOK -->
  <section x-show="view=='settings'" x-cloak class="flex min-h-0 flex-1 flex-col gap-3">
    <div class="flex items-center justify-between text-white">
      <button class="btn btn-ghost text-white" @click="view='menu'"><i data-lucide="arrow-left" class="size-5"></i>Vissza</button>
      <h1 class="text-2xl font-extrabold">Beállítások</h1>
      <button class="btn btn-ghost text-white" @click="reset()"><i data-lucide="rotate-ccw" class="size-5"></i>Alaphelyzet</button>
    </div>
    <div class="card min-h-0 flex-1 overflow-y-auto bg-base-100 p-5 shadow-2xl">
      <label class="mb-3 flex items-center justify-between border-b-2 border-base-200 pb-4 text-xl font-bold">
        <span class="flex items-center gap-2"><i data-lucide="volume-2" class="size-6"></i>Hangok</span>
        <input type="checkbox" class="toggle toggle-primary toggle-lg" x-model="s.sound" @change="save()">
      </label>
      <template x-for="g in groups" :key="g.k">
        <div class="mb-4 border-b-2 border-base-200 pb-4">
          <h2 x-show="g.h" class="mt-2 mb-2 text-2xl font-extrabold text-primary" x-text="g.h"></h2>
          <p x-show="g.n" class="mb-2 text-sm text-base-content/60" x-text="g.n"></p>
          <h3 class="mb-2 text-lg font-bold" x-text="g.t"></h3>
          <template x-for="fl in g.x?['min','max',g.x[0]]:['min','max']" :key="fl">
            <div class="my-2 flex items-center justify-between">
              <span x-text="g.x&&fl==g.x[0]?g.x[1]:g.ban?(fl=='min'?'Legkisebb szám':'Legnagyobb szám'):(fl=='min'?'Tól':'Ig')"></span>
              <div class="join">
                <button class="btn btn-primary join-item w-14 text-2xl" @click="step(g,fl,-1)">−</button>
                <span class="join-item flex w-16 items-center justify-center bg-base-200 text-2xl font-extrabold" x-text="s[g.k][fl]"></span>
                <button class="btn btn-primary join-item w-14 text-2xl" @click="step(g,fl,1)">+</button>
              </div>
            </div>
          </template>
          <template x-if="g.ban">
            <div>
              <p class="mt-3 text-sm text-base-content/60">Tiltott számok – koppints a számra a tiltáshoz / engedélyezéshez:</p>
              <div class="mt-2 flex flex-wrap gap-2">
                <template x-for="n in range(g)" :key="n">
                  <button class="btn min-w-12 text-lg" :class="s[g.k].banned.includes(n)?'btn-error line-through':'btn-neutral btn-soft'"
                          @click="tog(g,n)" x-text="n"></button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </section>
</main>

<script>
const KEY='matekGyakorlo.settings.v1';
const R=()=>({min:2,max:10,banned:[10]});
const DEF=()=>({mult:R(),multExtra:R(),div:R(),divExtra:R(),add:{min:1,max:9},sub:{min:1,max:9},
  basic:{min:3,max:99,terms:2},mulA:{min:2,max:9},mulB:{min:4,max:29},dvd:{min:10,max:40},dvs:{min:2,max:40},
  table:{min:3,max:99,cols:5},sound:true});
// Beállítási csoportok: k = kulcs, lo/hi = korlátok, ban = tiltható számok, x = extra mező [név, felirat, min, max]
const GROUPS=[
  {h:'Szorzás',k:'mult',t:'Szorzótábla',ban:1,lo:1,hi:30},{k:'multExtra',t:'Szorzás és egyéb műveletek',ban:1,lo:1,hi:30},
  {h:'Osztás',k:'div',t:'Osztás',ban:1,lo:1,hi:30},{k:'divExtra',t:'Osztás és egyéb műveletek',ban:1,lo:1,hi:30},
  {k:'add',t:'Hozzáadott összeadás (egyéb műveleteknél)',lo:1,hi:99},{k:'sub',t:'Hozzáadott kivonás (egyéb műveleteknél)',lo:1,hi:99},
  {h:'Alapműveletek',n:'A műveletek sorrendje és a zárójeles feladatok is ezeket használják.',
   k:'basic',t:'Összeadás és kivonás',lo:1,hi:99,x:['terms','Tagok száma',2,5]},
  {k:'mulA',t:'Szorzás: első szorzótényező',lo:1,hi:30},{k:'mulB',t:'Szorzás: második szorzótényező',lo:1,hi:50},
  {k:'dvd',t:'Osztás: osztandó',lo:1,hi:99},{k:'dvs',t:'Osztás: osztó',lo:1,hi:99},
  {h:'Táblázatos feladatok',k:'table',t:'Számok a táblázatban',lo:1,hi:99,x:['cols','Oszlopok száma',3,8]}];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const okList=c=>{const r=[];for(let n=c.min;n<=c.max;n++)if(!c.banned.includes(n))r.push(n);return r.length?r:[c.min]};
const pick=c=>{const a=okList(c);return a[rnd(0,a.length-1)]};
const inR=c=>rnd(c.min,c.max);
const retry=(f,n=300)=>{for(let i=0;i<n;i++){const r=f();if(r)return r}return null};

// Beállítások mentése sütibe (ha a böngésző nem enged sütit, pl. helyi fájlnál, akkor localStorage-ba)
function readCookie(){const m=document.cookie.match(new RegExp('(?:^|; )'+KEY.replace(/\./g,'\\.')+'=([^;]*)'));return m?decodeURIComponent(m[1]):null}
function load(){const s=DEF();let raw=null;try{raw=readCookie()}catch(e){}
  if(!raw)try{raw=localStorage.getItem(KEY)}catch(e){}
  try{const o=JSON.parse(raw||'null');if(o){
    if(typeof o.sound=='boolean')s.sound=o.sound;
    for(const g of GROUPS){const c=o[g.k],d=s[g.k];
      if(!c||typeof c.min!='number'||typeof c.max!='number'||c.min>c.max||c.min<g.lo||c.max>g.hi)continue;
      d.min=c.min;d.max=c.max;if(d.banned)d.banned=Array.isArray(c.banned)?c.banned.filter(n=>typeof n=='number'):[];
      if(g.x){const[f,,lo,hi]=g.x,v=c[f];if(Number.isInteger(v)&&v>=lo&&v<=hi)d[f]=v}}}}catch(e){}return s}
function store(s){const v=JSON.stringify(s);let ok=false;
  try{document.cookie=KEY+'='+encodeURIComponent(v)+'; max-age=31536000; path=/; SameSite=Lax';ok=readCookie()===v}catch(e){}
  if(!ok)try{localStorage.setItem(KEY,v)}catch(e){}}

// Feladatgenerálás. Egy tag: {t: szöveg, v: érték}. Részeredmény és végeredmény sosem negatív.
function classic(s,m){const c=s[m],a=pick(c),b=pick(c),mul=m.startsWith('mult'),base=mul?a*b:b;
  let t=mul?`${a} × ${b}`:`${a*b} ÷ ${a}`,v=base;
  if(m.endsWith('Extra')){const hi=Math.min(s.sub.max,base);let sign=1,x;
    if(hi>=s.sub.min&&Math.random()<.5){sign=-1;x=rnd(s.sub.min,hi)}else x=rnd(s.add.min,s.add.max);
    t+=` ${sign<0?'−':'+'} ${x}`;v=base+sign*x}
  return{t,v}}
function divPairs(s,lo=s.dvd.min,hi=s.dvd.max){const r=[];
  for(let a=lo;a<=hi;a++)for(let b=Math.max(2,s.dvs.min);b<=s.dvs.max&&b<a;b++)if(a%b==0)r.push([a,b]);return r}
const any=a=>a.length?a[rnd(0,a.length-1)]:null;
const num=s=>{const v=inR(s.basic);return{t:''+v,v}};
// Szorzat legfeljebb 120 lehet (alapműveletek, műveletek sorrendje, zárójeles feladatok)
const MAXP=120;
function mdTerm(s){const p=Math.random()<.5?any(divPairs(s)):null;
  if(p)return{t:`${p[0]} : ${p[1]}`,v:p[0]/p[1]};
  const a=inR(s.mulA),hi=Math.min(s.mulB.max,Math.floor(MAXP/a));if(hi<s.mulB.min)return null;const b=rnd(s.mulB.min,hi);return Math.random()<.5?{t:`${a} × ${b}`,v:a*b}:{t:`${b} × ${a}`,v:a*b}}
// Tagok összefűzése + és − jelekkel; a "minus" indexű tag elé kötelezően − kerül
function chain(terms,minus=-1){if(terms.some(x=>!x))return null;let v=terms[0].v,t=terms[0].t;
  for(let i=1;i<terms.length;i++){const x=terms[i],m=i==minus||(v>=x.v&&Math.random()<.5);
    if(m&&v<x.v)return null;v+=m?-x.v:x.v;t+=` ${m?'−':'+'} ${x.t}`}return{t,v}}
// Két szám (p + q vagy p − q) az alapműveletek tartományából, amelynek eredménye r
function pairFor(s,r){const c=s.basic,o=[],lo=Math.max(c.min,r-c.max),hi=Math.min(c.max,r-c.min),hq=c.max-r;
  if(lo<=hi)o.push(()=>{const p=rnd(lo,hi);return`${p} + ${r-p}`});
  if(r>=1&&c.min<=hq)o.push(()=>{const q=rnd(c.min,hq);return`${q+r} − ${q}`});
  return o.length?any(o)():null}
// Zárójeles tag: (p ± q) × x, x × (p ± q), (p ± q) : d vagy önálló (p ± q), amely elé − kerül
function parenTerm(s,first){const k=[0,1];if(!first)k.push(2);
  switch(any(k)){
    case 0:{const x=inR(s.mulA),hi=Math.min(s.mulB.max,Math.floor(MAXP/x));if(x<2||hi<s.mulB.min)return null;
      const r=rnd(s.mulB.min,hi),p=pairFor(s,r);if(!p)return null;
      return Math.random()<.5?{t:`${x} × (${p})`,v:x*r}:{t:`(${p}) × ${x}`,v:x*r}}
    case 1:{const d=any(divPairs(s)),p=d&&pairFor(s,d[0]);if(!p)return null;return{t:`(${p}) : ${d[1]}`,v:d[0]/d[1]}}
    case 2:{const r=inR(s.basic),p=pairFor(s,r);if(!p)return null;return{t:`(${p})`,v:r,neg:1}}}}
// A kifejezés értéke zárójelek nélkül (a zárójeleknek mindig változtatniuk kell az eredményen)
function flat(t){const k=t.replace(/[()]/g,'').split(' ');let sum=0,sg=1,pr=+k[0];
  for(let i=1;i<k.length;i+=2){const o=k[i],n=+k[i+1];if(o=='×')pr*=n;else if(o==':')pr/=n;else{sum+=sg*pr;sg=o=='+'?1:-1;pr=n}}
  return sum+sg*pr}
const GEN={
  addsub:s=>retry(()=>chain(Array.from({length:s.basic.terms},()=>num(s)))),
  order:s=>retry(()=>{const n=s.basic.terms,k=rnd(0,n-1);
    return chain(Array.from({length:n},(_,i)=>i==k||Math.random()<.4?mdTerm(s):num(s)))}),
  paren:s=>retry(()=>{const n=s.basic.terms,k=rnd(0,n-1),pt=parenTerm(s,k==0);if(!pt)return null;
    const c=chain(Array.from({length:n},(_,i)=>i==k?pt:Math.random()<.3?mdTerm(s):num(s)),pt.neg?k:-1);
    return c&&flat(c.t)!==c.v?c:null})};

// Táblázatos feladat: 3 sor (▲ ● ■), oszloponként egy szám rejtve, végig ugyanaz a szabály (X + Y = Z vagy X × Y = Z)
const SHN=['háromszög','kör','négyzet'],SHC=['#f97316','#3b82f6','#22c55e'];
const SHP=['<path d="M12 2 23 21H1Z"/>','<circle cx="12" cy="12" r="10.5"/>','<rect x="2" y="2" width="20" height="20" rx="3"/>'];
const shape=(i,z=28)=>`<svg class="shp" width="${z}" height="${z}" viewBox="0 0 24 24" fill="${SHC[i]}" role="img" aria-label="${SHN[i]}">${SHP[i]}</svg>`;
function genTable(s){let{min,max,cols:n}=s.table;const ops=[],ml=Math.max(2,min);
  if(max>=2*min)ops.push('+');if(ml*ml<=max)ops.push('×');if(!ops.length){min=3;max=99;ops.push('+')}

    if(op=='+'){x=rnd(min,max-min);y=rnd(min,max-x);z=x+y}else{x=rnd(ml,Math.floor(max/ml));y=rnd(ml,Math.floor(max/x));z=x*y}

const OPS=['+','−','×','÷','='];

// Hangok: Howler + a böngészőben generált WAV (nincs szükség hangfájlokra)
function wav(notes){const sr=22050,d=[];notes.forEach(([f,ms])=>{const n=sr*ms/1000|0;for(let i=0;i<n;i++)d.push(Math.sin(2*Math.PI*f*i/sr)*Math.min(1,i/200,(n-i)/400)*16000)});

  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);
  d.forEach((x,i)=>v.setInt16(44+i*2,x,true));let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return 'data:audio/wav;base64,'+btoa(s)}
const mk=n=>new Howl({src:[wav(n)],format:['wav'],volume:.8});
const sounds={ok:mk([[660,90],[880,150]]),bad:mk([[220,140],[160,240]]),win:mk([[523,120],[659,120],[784,120],[1047,320]])};
let tm=null,chart=null;

function app(){return{
  view:'menu',grp:null,md:null,OPS,mode:null,s:load(),problem:'',ans:0,input:'',t0:0,now:0,tEnd:0,times:[],locked:false,fb:'',tb:genTable(DEF()),
  T:{mult:['Szorzótábla','Szorzótábla gyakorlása.'],multExtra:['Szorzás és egyéb műveletek','Szorzás után még egy összeadás vagy kivonás is jön.'],
     div:['Osztás','A szorzótábla visszafelé, egész számos osztás.'],divExtra:['Osztás és egyéb műveletek','Osztás után még egy összeadás vagy kivonás is jön.'],
     addsub:['Összeadás és kivonás','Adj össze és vonj ki! Például: 67 + 15 = ?'],
     order:['Műveletek sorrendje','Először szorozz és ossz, utána adj össze és vonj ki! Például: 18 + 21 : 3 = ?'],
     paren:['Zárójeles feladatok','Ami zárójelben van, azt számold ki először! Például: (12 + 8) : 4 = ?'],
     table:['Táblázatos feladatok','Minden oszlopban ugyanaz a szabály. Találd ki a hiányzó számokat, és írj fel három szabályt!']},
  groups:GROUPS,
  init(){this.$nextTick(()=>lucide.createIcons())},
  f(x){return x.toFixed(1)+' s'},
  shape,
  snd(k){if(this.s.sound)sounds[k].play()},
  get psize(){const n=this.problem.length+4;return`clamp(22px,min(7vh,${140/n}vw,${1100/n}px),80px)`},
  get el(){return((this.locked&&this.tEnd?this.tEnd:this.now)-this.t0)/1000},
  get avg(){return this.times.reduce((a,b)=>a+b,0)/(this.times.length||1)},
  get best(){return Math.min(...this.times)},
  get worst(){return Math.max(...this.times)},
  get info(){const s=this.s,m=this.mode,r=c=>`${c.min}–${c.max}`;
    if(m=='table')return`Számok: ${r(s.table)} · Oszlopok: ${s.table.cols}`;
    if(m=='addsub'||m=='order'||m=='paren'){let t=`Számok: ${r(s.basic)} · Tagok: ${s.basic.terms}`;
      if(m!='addsub')t+=` · ×: ${r(s.mulA)} és ${r(s.mulB)} · Osztandó: ${r(s.dvd)}, osztó: ${r(s.dvs)}`;return t}
    const c=s[m];if(!c)return'';const b=c.banned.filter(n=>n>=c.min&&n<=c.max);
    let t=`Számok: ${r(c)}`+(b.length?` (tiltva: ${b.join(', ')})`:'');
    if(m.endsWith('Extra'))t+=` · +: ${r(s.add)} · −: ${r(s.sub)}`;return t},
  openSub(g){this.grp=g;this.view='sub'},
  open(m){if(m=='table')this.grp=null;this.mode=m;this.view='intro'},
  back(){this.view=this.grp?'sub':'menu'},
  tick(){this.locked=false;this.tEnd=0;this.t0=this.now=performance.now();clearInterval(tm);tm=setInterval(()=>this.now=performance.now(),100)},
  start(){this.times=[];if(this.mode=='table'){this.view='table';this.nextTable()}else{this.view='game';this.next()}},
  gen(){const p=(GEN[this.mode]&&GEN[this.mode](this.s))||classic(this.s,this.mode in this.s?this.mode:'mult');this.problem=p.t;this.ans=p.v},
  next(){this.gen();this.input='';this.fb='';this.tick()},
  press(k){if(this.locked)return;if(k=='⌫')this.input=this.input.slice(0,-1);else if(k=='✔')this.submit();else if(this.input.length<4)this.input+=k},
  submit(){if(this.locked||!this.input)return;
    if(+this.input===this.ans){this.locked=true;clearInterval(tm);this.tEnd=performance.now();this.times.push((this.tEnd-this.t0)/1000);
      this.fb='ok';this.snd('ok');confetti({particleCount:50,spread:70,origin:{y:.7}});
      setTimeout(()=>{if(this.view=='game')this.next()},1000)}
    else{this.fb='bad';this.snd('bad');this.input='';setTimeout(()=>{if(this.fb=='bad')this.fb=''},600)}},
  nextTable(){this.md=null;this.tb=genTable(this.s);this.tick()},
  touch(){const tb=this.tb;tb.msg='';tb.rok=[null,null,null];tb.cok=tb.cols.map(()=>null)},
  openNum(i){if(!this.tb.done)this.md={k:'num',i,v:this.tb.val[i]}},
  openSlot(ri,j){if(!this.tb.done)this.md={k:j%2?'op':'sh',ri,j}},

    else if(k=='⌫')m.v=m.v.slice(0,-1);else if(m.v.length<3)m.v+=k},
  mpick(x){const m=this.md;this.tb.rules[m.ri][m.j]=x;this.md=null;this.touch()},
  reveal(){const tb=this.tb;if(tb.done)return;tb.val=tb.cols.map((c,i)=>''+c[tb.hide[i]]);this.touch();
    tb.shown=tb.done=true;this.locked=true;clearInterval(tm);this.tEnd=performance.now();
    tb.msg='Ez a megoldás. Ez a feladat nem számít bele az eredménybe.'},
  check(){const tb=this.tb;
    if(tb.val.some(v=>v==='')){tb.msg='Írd be az összes hiányzó számot!';this.snd('bad');return}

  finish(){clearInterval(tm);this.md=null;this.locked=true;this.view='summary';
    if(this.times.length){this.snd('win');confetti({particleCount:160,spread:100,origin:{y:.5}})}

      options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,title:{display:true,text:'mp'}},x:{title:{display:true,text:'Feladat'}}}}})},
  range(g){const c=this.s[g.k],r=[];for(let n=c.min;n<=c.max;n++)r.push(n);return r},
  step(g,fl,d){const c=this.s[g.k],v=c[fl]+d,[lo,hi]=fl=='min'?[g.lo,c.max]:fl=='max'?[c.min,g.hi]:[g.x[2],g.x[3]];
    if(v>=lo&&v<=hi){c[fl]=v;this.save()}},
  tog(g,n){const c=this.s[g.k],i=c.banned.indexOf(n);if(i>=0)c.banned.splice(i,1);else if(okList(c).length>1)c.banned.push(n);this.save()},
  reset(){if(confirm('Visszaállítod az alapbeállításokat?')){this.s=DEF();this.save()}},

}}
</script>
